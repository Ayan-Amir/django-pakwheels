name: django-pakwheels

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

# Mount source so code edits apply without rebuilding (rebuild after Dockerfile/requirements changes).
x-app-volumes: &app-volumes
  - .:/app
  - media_data:/app/media

x-app-environment: &app-environment
  SECRET_KEY: ${SECRET_KEY:-django-insecure-change-me-in-production}
  DEBUG: ${DEBUG:-0}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
  POSTGRES_DB: ${POSTGRES_DB:-pakwheels}
  POSTGRES_USER: ${POSTGRES_USER:-pakwheels}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pakwheels}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pakwheels}
      POSTGRES_USER: ${POSTGRES_USER:-pakwheels}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pakwheels}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pakwheels} -d ${POSTGRES_DB:-pakwheels}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: *app-build
    image: django-pakwheels-app
    entrypoint: ["/docker-entrypoint-web.sh"]
    env_file:
      - .env
    environment:
      <<: *app-environment
    volumes: *app-volumes
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8000)); s.close()",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  celery-worker:
    build: *app-build
    image: django-pakwheels-app
    command: celery -A config worker -l info
    env_file:
      - .env
    environment:
      <<: *app-environment
    volumes: *app-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  celery-beat:
    build: *app-build
    image: django-pakwheels-app
    command: >
      celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      <<: *app-environment
    volumes: *app-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
