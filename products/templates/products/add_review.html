<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Add Review</title>
	</head>
	<body>
		<a href="{% url 'product_detail' product.id %}">Back to Product Detail</a>
		<h2>Add Review for {{ product.title }}</h2>

		<form method="POST">
			{% csrf_token %} {{ form.as_p }}
			<button type="submit">Submit Review</button>
		</form>
	</body>
</html>
